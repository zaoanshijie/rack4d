name: Build RadxaOS images for ROCK 4D

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
  schedule:
    # Daily at 16:00 UTC = 00:00 Beijing time
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      rsdk_ref:
        description: "rsdk git ref (branch / tag / commit SHA, empty = main)"
        required: false
        default: "main"
      force:
        description: "Rebuild even if this rsdk revision already has a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: build-rock4d
  cancel-in-progress: true

jobs:
  resolve:
    name: "Resolve build target"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      rsdk_ref: ${{ steps.decide.outputs.rsdk_ref }}
      tag: ${{ steps.decide.outputs.tag }}
      official_tag: ${{ steps.decide.outputs.official_tag }}
      official_published: ${{ steps.decide.outputs.official_published }}
    steps:
      - name: "Decide what to build"
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_RSDK_REF: ${{ inputs.rsdk_ref }}
        run: |
          set -euo pipefail

          # Legacy migration (idempotent): rename old rN-tagged releases to rsdk-commit-hash tags.
          # r5 was built from rsdk main @ 6340851ff7d9e12bfdef7f57280c475f1725c105.
          if gh release view r5 >/dev/null 2>&1 && ! gh release view 6340851ff7d9 >/dev/null 2>&1; then
            echo "Migrating legacy release tag r5 -> 6340851ff7d9"
            gh release edit r5 --tag 6340851ff7d9 --title "ROCK 4D RadxaOS bookworm (rsdk 6340851ff7d9)"
          fi

          # Latest official release of radxa-build/radxa-rk3576 (informational sync marker).
          # Note: official builds always use rsdk main at build time and do NOT pin the rsdk
          # revision in release metadata, so "syncing" an official release means building
          # the current rsdk main (exactly what upstream CI itself does).
          OFFICIAL_INFO=$(gh api repos/radxa-build/radxa-rk3576/releases/latest --jq '[.tag_name, .published_at] | @tsv')
          OFFICIAL_TAG=$(echo "$OFFICIAL_INFO" | cut -f1)
          OFFICIAL_PUBLISHED=$(echo "$OFFICIAL_INFO" | cut -f2)
          echo "Official latest release: $OFFICIAL_TAG (published $OFFICIAL_PUBLISHED)"

          # rsdk revision to build: input ref, or main.
          REF="${INPUT_RSDK_REF:-main}"
          if [[ -z "$REF" ]]; then REF="main"; fi
          RSDK_SHA=$(gh api "repos/RadxaOS-SDK/rsdk/commits/$REF" --jq '.sha')
          TAG="${RSDK_SHA:0:12}"
          echo "Resolved rsdk revision: $RSDK_SHA (release tag: $TAG)"

          # Push-triggered runs always build (validates workflow changes).
          FORCE="false"
          if [[ "$EVENT_NAME" == "push" ]]; then FORCE="true"; fi
          if [[ "$INPUT_FORCE" == "true" ]]; then FORCE="true"; fi

          EXISTS="false"
          if gh release view "$TAG" >/dev/null 2>&1; then EXISTS="true"; fi

          if [[ "$EXISTS" == "true" && "$FORCE" != "true" ]]; then
            echo "Nothing to build: release '$TAG' for rsdk $RSDK_SHA already exists (official latest: $OFFICIAL_TAG)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will build rsdk $RSDK_SHA and publish release '$TAG' (event=$EVENT_NAME, force=$FORCE, exists=$EXISTS; official latest: $OFFICIAL_TAG)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "rsdk_ref=$RSDK_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "official_tag=$OFFICIAL_TAG" >> "$GITHUB_OUTPUT"
          echo "official_published=$OFFICIAL_PUBLISHED" >> "$GITHUB_OUTPUT"

  build:
    name: "Build ${{ matrix.edition }} image"
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        edition:
          - kde
          - cli
    steps:
      - name: "Checkout rsdk"
        uses: actions/checkout@v7
        with:
          repository: RadxaOS-SDK/rsdk
          ref: ${{ needs.resolve.outputs.rsdk_ref }}
          submodules: recursive

      - name: "Enable KVM group perms"
        shell: bash
        run: |
          if [[ -c /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "/dev/kvm not found. It may take extra time to deploy rootfs to image."
          fi

      - name: "Set up QEMU Emulation"
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest

      - name: "Build within devcontainer"
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            src/bin/rsdk setup
            src/bin/rsdk shell rsdk build --test-repo --sector-size 512 --image-name output_512.img radxa-rk3576 bookworm ${{ matrix.edition }}

      - name: "Verify SSH is included in the image"
        shell: bash
        run: |
          cd "out/radxa-rk3576_bookworm_${{ matrix.edition }}"
          grep "openssh-server" manifest
          echo "OK: openssh-server is installed and enabled by default (SSH access out of the box)."

      - name: "Prepare artifacts"
        shell: bash
        run: |
          cd "out/radxa-rk3576_bookworm_${{ matrix.edition }}"
          sudo chown -R $USER:$GROUPS .
          STAMP="${{ needs.resolve.outputs.tag }}"
          TUPLE="radxa-rk3576_bookworm_${{ matrix.edition }}"
          rm -f rootfs.tar seed.tar.xz
          rm -rf debs
          for i in *; do
            mv "$i" "${TUPLE}_${STAMP}.$i"
          done
          xz -vT 0 ./*.img
          find . -type f -exec sha512sum {} \; | tee "${TUPLE}_${STAMP}.sha512sum"
          echo "--- artifacts ---"
          ls -lah

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "radxa-rk3576_bookworm_${{ matrix.edition }}_${{ needs.resolve.outputs.tag }}"
          path: "out/radxa-rk3576_bookworm_${{ matrix.edition }}/*"
          if-no-files-found: error

  report:
    name: "Report build failure"
    needs: [resolve, build, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Collect failed step logs"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sleep 15
          rm -f job-*.raw.log failed-jobs.tsv issue-body.md failed.log
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > failed-jobs.tsv
          echo "--- failed jobs ---"
          cat failed-jobs.tsv
          while IFS=$'\t' read -r id name; do
            echo "Downloading log for job $id ($name)"
            curl -sSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/actions/jobs/$id/logs" \
              -o "job-$id.raw.log" || echo "(curl failed for job $id)" > "job-$id.raw.log"
            echo "  raw log size: $(wc -c < "job-$id.raw.log") bytes"
          done < failed-jobs.tsv
          cat job-*.raw.log > failed.log || true
          {
            echo "## Build failure report"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID"
            echo ""
            while IFS=$'\t' read -r id name; do
              echo "### Job: $name (id $id)"
              echo ""
              echo '```'
              sed 's/\x1B\[[0-9;?]*[a-zA-Z]//g; s/\x1B][^\x07]*\x07//g' "job-$id.raw.log" | tail -c 25000
              echo '```'
              echo ""
            done < failed-jobs.tsv
          } > issue-body.md

      - name: "Upload full failed log as artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "failed-logs-${{ github.run_id }}"
          path: failed.log
          if-no-files-found: warn

      - name: "Create or update diagnostics issue"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="[diagnostics] build-failure-log"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --limit 1 --jq '.[0].number // empty')
          if [[ -n "$NUM" ]]; then
            echo "Commenting on existing issue #$NUM"
            gh issue comment "$NUM" --body-file issue-body.md
          else
            echo "Creating diagnostics issue"
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi

  release:
    name: "Create release and upload images"
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Download artifacts"
        uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: "Create release and upload assets"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RSDK_SHA: ${{ needs.resolve.outputs.rsdk_ref }}
          OFFICIAL_TAG: ${{ needs.resolve.outputs.official_tag }}
          OFFICIAL_PUBLISHED: ${{ needs.resolve.outputs.official_published }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "--- downloaded assets ---"
          ls -lah assets/
          cat > release-notes.md <<'EOF'
          ## RadxaOS for Radxa ROCK 4D（Debian 12 bookworm）

          | 镜像 | 说明 |
          | ---- | ---- |
          | `*_kde_*.output_512.img.xz` | KDE Plasma 桌面版（与官方发布一致） |
          | `*_cli_*.output_512.img.xz` | CLI 精简版（无桌面环境） |

          - 两个镜像均默认安装并启用 OpenSSH（`openssh-server`），开机即可 SSH 连接
          - 首次开机按提示完成 rsetup 初始配置（RadxaOS 默认账号 `radxa` / `radxa`，以 Radxa 官方文档为准）
          - 标准 512 字节扇区镜像，适用于 SD 卡 / eMMC，首次启动自动扩展根分区
          - 使用 Radxa APT test 通道软件源构建（rk3576 内核目前仅发布于 test 通道，与 rsdk 官方 CI 一致）

          ### 版本信息

          - 构建系统 rsdk 版本：`__TAG__`（[完整提交 __RSDK_SHA__](https://github.com/RadxaOS-SDK/rsdk/commit/__RSDK_SHA__)）
          - 触发方式：`__EVENT__`
          - 对应官方镜像仓库当时最新 release：[__OFFICIAL_TAG__](https://github.com/radxa-build/radxa-rk3576/releases/tag/__OFFICIAL_TAG__)（发布于 __OFFICIAL_PUBLISHED__）

          ### 烧录

          ```bash
          xzcat radxa-rk3576_bookworm_kde_*.output_512.img.xz | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress
          ```

          ### 校验

          ```bash
          sha512sum -c *.sha512sum
          ```
          EOF
          sed -i \
            -e "s/__TAG__/$TAG/g" \
            -e "s/__RSDK_SHA__/$RSDK_SHA/g" \
            -e "s/__EVENT__/$EVENT_NAME/g" \
            -e "s/__OFFICIAL_TAG__/$OFFICIAL_TAG/g" \
            -e "s/__OFFICIAL_PUBLISHED__/$OFFICIAL_PUBLISHED/g" \
            release-notes.md
          TITLE="ROCK 4D RadxaOS bookworm (rsdk $TAG)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists; updating title/notes and overwriting assets."
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md
          fi
          gh release upload "$TAG" assets/* --clobber
          # Prune stale assets that no longer match the current naming scheme.
          echo "--- pruning stale assets ---"
          comm -13 <(ls assets/ | sort) <(gh release view "$TAG" --json assets --jq '.[].name' | sort) | while read -r name; do
            echo "Deleting stale asset: $name"
            gh release delete-asset "$TAG" "$name" --yes
          done
          echo "--- final release assets ---"
          gh release view "$TAG" --json assets --jq '.[].name'
