name: Build RadxaOS images for ROCK 4D

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
  schedule:
    # Daily at 16:00 UTC = 00:00 Beijing time
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      rsdk_ref:
        description: "rsdk git ref for the 'main' tracking target (branch / tag / commit SHA, empty = main)"
        required: false
        default: "main"
      force:
        description: "Rebuild even if a target rsdk revision already has a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: build-rock4d
  cancel-in-progress: true

jobs:
  resolve:
    name: "Resolve build targets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      targets: ${{ steps.decide.outputs.targets }}
      include: ${{ steps.decide.outputs.include }}
    steps:
      - name: "Decide what to build"
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_RSDK_REF: ${{ inputs.rsdk_ref }}
        run: |
          set -euo pipefail

          # Legacy migration (idempotent): rename old rN-tagged releases to rsdk-commit-hash tags.
          # r5 was built from rsdk main @ 6340851ff7d9e12bfdef7f57280c475f1725c105.
          if gh release view r5 >/dev/null 2>&1 && ! gh release view 6340851ff7d9 >/dev/null 2>&1; then
            echo "Migrating legacy release tag r5 -> 6340851ff7d9"
            gh release edit r5 --tag 6340851ff7d9 --title "ROCK 4D RadxaOS bookworm (rsdk 6340851ff7d9)"
          fi

          FORCE="false"
          if [[ "$EVENT_NAME" == "push" ]]; then FORCE="true"; fi
          if [[ "$INPUT_FORCE" == "true" ]]; then FORCE="true"; fi

          TARGETS="[]"
          append_target() {
            TARGETS=$(echo "$TARGETS" | jq --arg rsdk_ref "$1" --arg kind "$2" --arg ot "$3" --arg op "$4" \
              '. += [{rsdk_ref:$rsdk_ref, tag:($rsdk_ref[0:12]), kind:$kind, official_tag:$ot, official_published:$op}]')
          }

          # --- Candidate 1: rsdk revision recorded by the latest official release ---
          # radxa-build/radxa-rk3576 release -> target_commitish (their repo commit) ->
          # commit message "chore: templates generated by RadxaOS-SDK/rsdk@<sha>" -> build that rsdk revision.
          OFFICIAL_INFO=$(gh api repos/radxa-build/radxa-rk3576/releases/latest --jq '[.tag_name, .published_at, .target_commitish] | @tsv' || true)
          OFFICIAL_SHA=""
          if [[ -n "${OFFICIAL_INFO:-}" ]]; then
            OFFICIAL_TAG=$(echo "$OFFICIAL_INFO" | cut -f1)
            OFFICIAL_PUBLISHED=$(echo "$OFFICIAL_INFO" | cut -f2)
            OFFICIAL_COMMITISH=$(echo "$OFFICIAL_INFO" | cut -f3)
            MSG=$(gh api "repos/radxa-build/radxa-rk3576/commits/$OFFICIAL_COMMITISH" --jq '.commit.message')
            if [[ "$MSG" =~ rsdk@([0-9a-f]{40}) ]]; then
              OFFICIAL_SHA="${BASH_REMATCH[1]}"
              echo "Official release $OFFICIAL_TAG records rsdk@$OFFICIAL_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
              append_target "$OFFICIAL_SHA" "official" "$OFFICIAL_TAG" "$OFFICIAL_PUBLISHED"
            else
              echo "WARNING: no rsdk revision found in official commit message; skipping official sync." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "WARNING: cannot query official latest release; skipping official sync." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # --- Candidate 2: rsdk main (or the manually specified ref) ---
          REF="${INPUT_RSDK_REF:-main}"
          if [[ -z "$REF" ]]; then REF="main"; fi
          MAIN_SHA=$(gh api "repos/RadxaOS-SDK/rsdk/commits/$REF" --jq '.sha')
          if [[ -z "$OFFICIAL_SHA" || "$OFFICIAL_SHA" != "$MAIN_SHA" ]]; then
            append_target "$MAIN_SHA" "main" "" ""
          fi

          # --- Dedup against existing releases (unless forced) ---
          if [[ "$FORCE" != "true" ]]; then
            KEPT="[]"
            N=$(echo "$TARGETS" | jq 'length')
            for ((i = 0; i < N; i++)); do
              T=$(echo "$TARGETS" | jq -c ".[$i]")
              TAG=$(echo "$T" | jq -r '.tag')
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "Skip $(echo "$T" | jq -r '.kind') target rsdk $TAG: release already exists." | tee -a "$GITHUB_STEP_SUMMARY"
              else
                KEPT=$(echo "$KEPT" | jq --argjson t "$T" '. += [$t]')
              fi
            done
            TARGETS="$KEPT"
          fi

          INCLUDES=$(echo "$TARGETS" | jq -c '[.[] as $t | ("kde", "cli") as $e | {rsdk_ref:$t.rsdk_ref, tag:$t.tag, kind:$t.kind, edition:$e}]')
          echo "targets=$(echo "$TARGETS" | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "include=$INCLUDES" >> "$GITHUB_OUTPUT"
          echo "should_build=$(echo "$TARGETS" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "Targets to build: $TARGETS" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: "Build ${{ matrix.edition }} image (${{ matrix.kind }} ${{ matrix.tag }})"
    needs: resolve
    if: needs.resolve.outputs.should_build != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.include) }}
    steps:
      - name: "Checkout rsdk"
        uses: actions/checkout@v7
        with:
          repository: RadxaOS-SDK/rsdk
          ref: ${{ matrix.rsdk_ref }}
          submodules: recursive

      - name: "Patch rsdk for CI"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail

          # 1) Never wait for interactive input in CI.
          #    Old rsdk revisions block forever on `read -rp "Press Enter..."` when
          #    a soft-failure path triggers inside the devcontainer (no TTY).
          sed -i 's/read -rp "Press Enter to continue..."/exit 1 # CI: fail fast instead of interactive wait/' src/libexec/rsdk/rsdk-setup
          grep -q "exit 1 # CI: fail fast" src/libexec/rsdk/rsdk-setup

          # 2) Old rsdk revisions do not declare the `git-hooks` devenv input. The current
          #    devenv CLI evaluates config.git-hooks unconditionally and throws
          #    "git-hooks or pre-commit-hooks input required" when it is missing.
          #    Upstream rsdk main declares this input in devenv.yaml; add it the same way.
          python3 - <<'PYEOF'
          p = 'devenv.yaml'
          s = open(p).read()
          if 'git-hooks' in s:
              print('devenv.yaml already declares git-hooks input')
          else:
              block = (
                  '  git-hooks:\n'
                  '    url: github:cachix/git-hooks.nix\n'
                  '    inputs:\n'
                  '      nixpkgs:\n'
                  '        follows: nixpkgs\n'
              )
              s = s.rstrip('\n') + '\n' + block
              open(p, 'w').write(s)
              print('patched: declared git-hooks input in devenv.yaml')
          PYEOF

          # 3) Keep SSH enabled by default.
          #    RadxaOS first-boot config (/config/before.txt from rsetup-config-first-boot)
          #    runs `disable_service ssh` on first boot and only re-enables it when the
          #    board is headless (and the Rockchip DSI connector always reports
          #    "connected", so headless is never detected on these boards).
          #    Patch both copies shipped in the image and make sure ssh.service is enabled
          #    (systemctl --root creates the proper systemd enable symlinks offline).
          python3 - <<'PYEOF'
          import re
          p = 'src/share/rsdk/build/rootfs.jsonnet'
          s = open(p).read()
          m = re.search(r'^([ \t]*)// Adding additional customization commands', s, flags=re.M)
          if not m:
              print('FATAL: rootfs.jsonnet patch anchor not found')
              raise SystemExit(1)
          indent = m.group(1)
          hook = (
              indent + '|||\n'
              + indent + '    set -e\n'
              + indent + '    echo "[rack4d] Keep SSH enabled: patching first-boot config"\n'
              + indent + '    for f in "$1/config/before.txt" "$1/usr/share/doc/rsetup-config-first-boot/before.txt"; do\n'
              + indent + '        if [ -f "$f" ]; then\n'
              + indent + '            sed -i "s/^disable_service ssh$/# disable_service ssh  # rack4d: keep SSH enabled by default/; s/^disable_service ssh\\.socket$/# disable_service ssh.socket  # rack4d: keep SSH enabled by default/" "$f"\n'
              + indent + '        fi\n'
              + indent + '    done\n'
              + indent + '    systemctl --root="$1" enable ssh.service\n'
              + indent + '|||,\n'
          )
          s = s[:m.start()] + hook + s[m.start():]
          open(p, 'w').write(s)
          print('patched: injected SSH-enable customize-hook into rootfs.jsonnet')
          PYEOF

          # 4) For old (official-sync) rsdk revisions, pin devenv to the nixpkgs revision
          #    of that era. Old devenv configs are incompatible with the latest devenv
          #    CLI (e.g. "The option `dotenv.resolved' ... has no value defined");
          #    the era-appropriate CLI is what upstream used when building those
          #    revisions. Main-like targets keep the latest devenv (matches upstream CI).
          #    NOTE: `nix profile install` (not `add`) - old rsdk devcontainers pin nix 2.21
          #    which does not know the `add` subcommand.
          if [[ "$TARGET_KIND" == "official" ]]; then
            RSDK_DATE=$(git log -1 --format=%cI)
            NIXPKGS_PIN=$(gh api "repos/NixOS/nixpkgs/commits?sha=nixpkgs-unstable&until=$RSDK_DATE&per_page=1" --jq '.[0].sha')
            echo "Official target: pinning devenv to nixpkgs@${NIXPKGS_PIN} (era of rsdk commit $RSDK_DATE)"
            python3 - "$NIXPKGS_PIN" <<'PYEOF'
          import sys
          pin = sys.argv[1]
          p = "src/libexec/rsdk/rsdk-setup"
          s = open(p).read()
          anchor = "if ! command -v direnv || ! command -v devenv; then"
          if anchor not in s:
              print("FATAL: rsdk-setup anchor not found")
              raise SystemExit(1)
          pin_block = (
              "nix profile remove devenv >/dev/null 2>&1 || true\n"
              + "nix profile install \"github:NixOS/nixpkgs/%s#devenv\"  # rack4d: era-pinned devenv\n" % pin
          )
          open(p, "w").write(s.replace(anchor, pin_block + anchor, 1))
          print("patched: rsdk-setup installs era-pinned devenv ->", pin)
          PYEOF
          else
            echo "main-like target: keep latest devenv (matches upstream CI)"
          fi

          # 5) Adapt to the image-ng image generator (rsdk main after "feat: default to
          #    image-ng"). rsdk-build still passes the legacy `efi`/`sdboot` jsonnet
          #    args, which image-ng.jsonnet no longer accepts ("function has no
          #    parameter efi/sdboot"). Drop them only when image-ng.jsonnet does not
          #    declare those parameters, so the patch auto-disables once upstream
          #    reconciles both sides.
          if [[ -f src/share/rsdk/build/image-ng.jsonnet ]]; then
            if ! grep -Eq '^[[:space:]]*efi[[:space:]]*=' src/share/rsdk/build/image-ng.jsonnet; then
              sed -i '\#JSONNET_ARGS+=("--tla-code" "efi=\$RSDK_OPTION_EFI")#d' src/libexec/rsdk/rsdk-build
              echo "patched: dropped legacy efi jsonnet arg (image-ng)"
            fi
            if ! grep -Eq '^[[:space:]]*sdboot[[:space:]]*=' src/share/rsdk/build/image-ng.jsonnet; then
              sed -i '\#JSONNET_ARGS+=("--tla-code" "sdboot=\$RSDK_OPTION_SYSTEMD_BOOT")#d' src/libexec/rsdk/rsdk-build
              echo "patched: dropped legacy sdboot jsonnet arg (image-ng)"
            fi
          fi

      - name: "Enable KVM group perms"
        shell: bash
        run: |
          if [[ -c /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "/dev/kvm not found. It may take extra time to deploy rootfs to image."
          fi

      - name: "Set up QEMU Emulation"
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest

      - name: "Build within devcontainer"
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            src/bin/rsdk setup
            attempt=1
            while true; do
              if src/bin/rsdk shell rsdk build --test-repo --sector-size 512 --image-name output_512.img radxa-rk3576 bookworm ${{ matrix.edition }}; then
                break
              fi
              if [ "$attempt" -ge 2 ]; then
                echo "=== rsdk build still failing after $attempt attempts, giving up ==="
                exit 1
              fi
              echo "=== rsdk build attempt $attempt failed (transient upstream apt errors are common); retrying in 120s ==="
              attempt=$((attempt + 1))
              sleep 120
            done

      - name: "Verify SSH is enabled in the image"
        shell: bash
        run: |
          set -euo pipefail
          cd "out/radxa-rk3576_bookworm_${{ matrix.edition }}"
          grep "openssh-server" manifest
          tar -xOf rootfs.tar ./config/before.txt > /tmp/before.txt 2>/dev/null \
            || tar -xOf rootfs.tar config/before.txt > /tmp/before.txt
          if grep -q '^disable_service ssh' /tmp/before.txt; then
            echo "FAIL: first-boot config still disables ssh"
            exit 1
          fi
          # NOTE: no `grep -q` here - it exits early on first match, SIGPIPEs tar,
          # and pipefail would turn a successful match into a false failure.
          if ! tar -tf rootfs.tar | grep 'multi-user\.target\.wants/ssh\.service' > /dev/null; then
            echo "FAIL: ssh.service is not enabled in the image"
            exit 1
          fi
          echo "OK: openssh-server installed and enabled; first-boot config keeps SSH on (headless or not)."

      - name: "Prepare artifacts"
        shell: bash
        run: |
          cd "out/radxa-rk3576_bookworm_${{ matrix.edition }}"
          sudo chown -R $USER:$GROUPS .
          STAMP="${{ matrix.tag }}"
          TUPLE="radxa-rk3576_bookworm_${{ matrix.edition }}"
          rm -f rootfs.tar seed.tar.xz
          rm -rf debs
          for i in *; do
            mv "$i" "${TUPLE}_${STAMP}.$i"
          done
          xz -vT 0 ./*.img
          find . -type f -exec sha512sum {} \; | tee "${TUPLE}_${STAMP}.sha512sum"
          echo "--- artifacts ---"
          ls -lah

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "radxa-rk3576_bookworm_${{ matrix.edition }}_${{ matrix.tag }}"
          path: "out/radxa-rk3576_bookworm_${{ matrix.edition }}/*"
          if-no-files-found: error

  report:
    name: "Report build failure"
    needs: [resolve, build, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Collect failed step logs"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sleep 15
          rm -f job-*.raw.log failed-jobs.tsv issue-body.md failed.log
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > failed-jobs.tsv
          echo "--- failed jobs ---"
          cat failed-jobs.tsv
          while IFS=$'\t' read -r id name; do
            echo "Downloading log for job $id ($name)"
            curl -sSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/actions/jobs/$id/logs" \
              -o "job-$id.raw.log" || echo "(curl failed for job $id)" > "job-$id.raw.log"
            echo "  raw log size: $(wc -c < "job-$id.raw.log") bytes"
          done < failed-jobs.tsv
          cat job-*.raw.log > failed.log || true
          {
            echo "## Build failure report"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID"
            echo ""
            while IFS=$'\t' read -r id name; do
              echo "### Job: $name (id $id)"
              echo ""
              echo '```'
              sed 's/\x1B\[[0-9;?]*[a-zA-Z]//g; s/\x1B][^\x07]*\x07//g' "job-$id.raw.log" | tail -c 25000
              echo '```'
              echo ""
            done < failed-jobs.tsv
          } > issue-body.md

      - name: "Upload full failed log as artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "failed-logs-${{ github.run_id }}"
          path: failed.log
          if-no-files-found: warn

      - name: "Create or update diagnostics issue"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="[diagnostics] build-failure-log"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --limit 1 --jq '.[0].number // empty')
          if [[ -n "$NUM" ]]; then
            echo "Commenting on existing issue #$NUM"
            gh issue comment "$NUM" --body-file issue-body.md
          else
            echo "Creating diagnostics issue"
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi

  release:
    name: "Create releases and upload images"
    needs: [resolve, build]
    # Run even when some matrix legs failed, so that successful targets are still
    # released (per-target artifacts are checked below; targets without artifacts are skipped).
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.should_build != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      TARGETS: ${{ needs.resolve.outputs.targets }}
    steps:
      - name: "Download artifacts"
        uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: "Create releases and upload assets"
        shell: bash
        run: |
          set -euo pipefail
          echo "--- downloaded assets ---"
          ls -lah assets/ || true
          shopt -s nullglob
          FILES_ALL=(assets/*)
          if [[ ${#FILES_ALL[@]} -eq 0 ]]; then
            echo "No build artifacts available (builds failed); nothing to release."
            exit 0
          fi
          echo "$TARGETS" | jq -c '.[]' | while IFS= read -r t; do
            TAG=$(echo "$t" | jq -r '.tag')
            RSDK_SHA=$(echo "$t" | jq -r '.rsdk_ref')
            KIND=$(echo "$t" | jq -r '.kind')
            OFFICIAL_TAG=$(echo "$t" | jq -r '.official_tag // ""')
            OFFICIAL_PUBLISHED=$(echo "$t" | jq -r '.official_published // ""')
            if [[ "$KIND" == "official" ]]; then
              SOURCE_LINE="此 Release 与官方镜像仓库 [radxa-build/radxa-rk3576 __OFFICIAL_TAG__](https://github.com/radxa-build/radxa-rk3576/releases/tag/__OFFICIAL_TAG__) 对应（官方发布于 __OFFICIAL_PUBLISHED__），按官方记录的 rsdk 版本编译"
            else
              SOURCE_LINE="跟踪 [RadxaOS-SDK/rsdk](https://github.com/RadxaOS-SDK/rsdk) main 分支最新提交构建"
            fi
            cat > release-notes.md <<'EOF'
          ## RadxaOS for Radxa ROCK 4D（Debian 12 bookworm）

          | 镜像 | 说明 |
          | ---- | ---- |
          | `*_kde_*.output_512.img.xz` | KDE Plasma 桌面版（与官方发布一致） |
          | `*_cli_*.output_512.img.xz` | CLI 精简版（无桌面环境） |

          - 两个镜像均默认安装并启用 OpenSSH（`openssh-server`）：已修补官方首次开机配置（官方镜像首次开机默认禁用 SSH，仅无显示器时才启用；且 Rockchip 板子的 DSI 连接器始终上报已连接，headless 检测实际从不生效），无论是否连接显示器 SSH 都保持开启，开机即可连接
          - 首次开机按提示完成 rsetup 初始配置（RadxaOS 默认账号 `radxa` / `radxa`，以 Radxa 官方文档为准）
          - 标准 512 字节扇区镜像，适用于 SD 卡 / eMMC，首次启动自动扩展根分区
          - 使用 Radxa APT test 通道软件源构建（rk3576 内核目前仅发布于 test 通道，与 rsdk 官方 CI 一致）

          ### 版本信息

          - 构建系统 rsdk 版本：`__TAG__`（[完整提交 __RSDK_SHA__](https://github.com/RadxaOS-SDK/rsdk/commit/__RSDK_SHA__)）
          - __SOURCE_LINE__
          - 触发方式：`__EVENT__`

          ### 烧录

          ```bash
          xzcat radxa-rk3576_bookworm_kde_*.output_512.img.xz | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress
          ```

          ### 校验

          ```bash
          sha512sum -c *.sha512sum
          ```
          EOF
            sed -i \
              -e "s|__TAG__|$TAG|g" \
              -e "s|__RSDK_SHA__|$RSDK_SHA|g" \
              -e "s|__SOURCE_LINE__|$SOURCE_LINE|g" \
              -e "s|__OFFICIAL_TAG__|$OFFICIAL_TAG|g" \
              -e "s|__OFFICIAL_PUBLISHED__|$OFFICIAL_PUBLISHED|g" \
              -e "s|__EVENT__|$EVENT_NAME|g" \
              release-notes.md
            FILES=(assets/*_"$TAG".*)
            if [[ ${#FILES[@]} -eq 0 ]]; then
              echo "No artifacts for release '$TAG' (its build failed); skipping."
              continue
            fi
            TITLE="ROCK 4D RadxaOS bookworm (rsdk $TAG)"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "=== Release '$TAG' already exists; updating title/notes and overwriting assets. ==="
              gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            else
              echo "=== Creating release '$TAG' ==="
              gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md
            fi
            echo "--- uploading ${#FILES[@]} files to release $TAG ---"
            gh release upload "$TAG" "${FILES[@]}" --clobber
            echo "--- pruning stale assets on $TAG ---"
            comm -13 <(printf '%s\n' "${FILES[@]##*/}" | sort) <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort) | while IFS= read -r name; do
              echo "Deleting stale asset: $name"
              gh release delete-asset "$TAG" "$name" --yes
            done
            echo "--- final assets on $TAG ---"
            gh release view "$TAG" --json assets --jq '.assets[].name'
          done
